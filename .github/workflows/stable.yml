name: stable

# A stable build fires on every tag matching `v*` (ADR-0109). It is the
# population that picked the browser on purpose, and its cadence is
# "when the trunk is shippable", not "every commit". The bundle id is
# `com.thezer0.browser` (resolve-bundle.sh), the profile directory is
# `Zer0/`, and the appcast is `appcast-stable.xml`.
#
# Unlike canary, signing and notarisation are REQUIRED on stable, not
# conditional. A stable release that ships ad-hoc is a release that
# only the build machine can run, and that is not a release. The
# detect step turns the secrets into booleans; the build step below it
# fails the job early if either is missing, rather than letting
# sign.sh refuse a few minutes later with a longer log.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Two tags pushed in quick succession are two releases. Serialising
  # them would re-order which appcast entry lands first; letting both
  # run keeps the tag order honest. cancel-in-progress is false for
  # the same reason -- cancelling a release mid-notarisation leaves
  # Apple's queue holding a submission nothing follows up on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: blacksmith-6vcpu-macos-15
    # 90, not 30, because of the WebKit source offer below: on a pin bump it
    # clones ~7.4 GB and runs zstd -19 over ~5.3 GB of source on a 6-vcpu
    # runner. The tarball is cached per tag, so steady-state runs stay short.
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: toolchain
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::$DEVELOPER_DIR is gone on the Blacksmith image." >&2
            ls -d /Applications/Xcode_*.app >&2 || true
            exit 1
          fi
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: read WebKit pin
        id: pin
        # Stable's pin is the `WebKit-*` source-drop tag (ADR-0124), read as
        # data the same way scripts/webkit/common.sh reads it -- never sourced.
        run: |
          pin="$(sed -n 's/^WEBKIT_TAG_STABLE=//p' scripts/webkit/version.txt | tail -1)"
          [[ -n "$pin" ]] || { echo "no WEBKIT_TAG_STABLE in version.txt" >&2; exit 1; }
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      - name: restore WebKit build
        uses: actions/cache@v4
        with:
          path: webkit-build.tar.zst
          key: webkit-stable-${{ steps.pin.outputs.pin }}
          fail-on-cache-miss: true

      - name: extract WebKit
        run: |
          mkdir -p ~/.cache/zer0/webkit/src/WebKitBuild
          tar -x -I zstd -f webkit-build.tar.zst \
            -C ~/.cache/zer0/webkit/src/WebKitBuild

      - name: detect signing secrets
        id: signing
        # Stable fails fast if any signing or notarisation material is
        # missing; a stable release that ships ad-hoc is not a release.
        # The runner keychain is empty, so the identity name alone signs
        # nothing: the .p12 and its password have to arrive as secrets too,
        # and notarisation takes the four App Store Connect credentials
        # because no stored keychain profile survives an ephemeral runner.
        # The Sparkle key is still optional, because the appcast host is
        # not live yet.
        run: |
          si="${{ secrets.ZER0_SIGN_IDENTITY_STABLE }}"
          cert="${{ secrets.ZER0_SIGNING_CERT_P12_BASE64 }}"
          certpw="${{ secrets.ZER0_SIGNING_CERT_PASSWORD }}"
          aid="${{ secrets.ZER0_APPLE_ID }}"
          kid="${{ secrets.ZER0_APPLE_KEY_ID }}"
          kp8="${{ secrets.ZER0_NOTARY_KEY_P8_BASE64 }}"
          tid="${{ secrets.ZER0_APPLE_TEAM_ID }}"
          sp="${{ secrets.ZER0_SPARKLE_PRIVATE_KEY }}"
          if [[ -z "$si" || -z "$cert" || -z "$certpw" ]]; then
            echo "::error::Signing secrets incomplete: need ZER0_SIGN_IDENTITY_STABLE, ZER0_SIGNING_CERT_P12_BASE64 and ZER0_SIGNING_CERT_PASSWORD." >&2
            echo "::error::A stable release is signed by definition; refusing to build an unsigned one." >&2
            exit 1
          fi
          if [[ -z "$aid" || -z "$kid" || -z "$kp8" || -z "$tid" ]]; then
            echo "::error::Notarisation secrets incomplete: need ZER0_APPLE_ID, ZER0_APPLE_KEY_ID, ZER0_NOTARY_KEY_P8_BASE64 and ZER0_APPLE_TEAM_ID." >&2
            echo "::error::Gatekeeper refuses an unnotarised stable build on every Mac but this one." >&2
            exit 1
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          echo "notarize=true" >> "$GITHUB_OUTPUT"
          [[ -n "$sp" ]] && echo "sparkle=true" >> "$GITHUB_OUTPUT" || echo "sparkle=false" >> "$GITHUB_OUTPUT"

      - name: compute version
        id: ver
        # Runs before the build because the bundle carries the answer:
        # bundle.sh stamps these into CFBundleShortVersionString and
        # CFBundleVersion (ADR-0111). Stable versions come from the tag
        # itself (`v0.2.0` -> `0.2.0`), and the build number comes from
        # the one door -- bundle_version_for_channel in
        # apple/scripts/resolve-bundle.sh -- so the bundle and the
        # appcast cannot drift, and publish-appcast.sh refuses a
        # disagreement.
        run: |
          raw="${GITHUB_REF_NAME#v}"
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "archive=zer0-${raw}.zip" >> "$GITHUB_OUTPUT"
          . apple/scripts/resolve-bundle.sh
          # Canary can echo the substitution directly because its version
          # is constructed to match; a stable tag is typed by a human, so
          # the refusal must stay fatal -- inside `echo "$( ... )"` a
          # nonzero exit is swallowed and the build would run with an
          # empty build number.
          bv="$(bundle_version_for_channel stable "$raw")" || {
            echo "::error::tag '$GITHUB_REF_NAME' is not a stable version tag; expected vX.Y.Z (ADR-0111)." >&2
            exit 1
          }
          echo "bundle_version=${bv}" >> "$GITHUB_OUTPUT"

      - name: build stable
        env:
          ZER0_CHANNEL: stable
          ZER0_BUNDLE_VERSION: ${{ steps.ver.outputs.bundle_version }}
          ZER0_SHORT_VERSION: ${{ steps.ver.outputs.version }}
          ZER0_EMBED_WEBKIT: ~/.cache/zer0/webkit/src/WebKitBuild/Release
          ZER0_SPARKLE_PUBLIC_KEY: ${{ secrets.ZER0_SPARKLE_PUBLIC_KEY }}
        run: ./scripts/build.sh release

      - name: import signing certificate
        # Runner keychains are empty; the identity arrives as a .p12 in a
        # secret. Temporary keychain, cleaned in post — never touches the
        # login keychain. No `if:` here: the detect step above already
        # failed the job if the secrets are missing, and stable signs by
        # definition.
        env:
          ZER0_CERT_BASE64: ${{ secrets.ZER0_SIGNING_CERT_P12_BASE64 }}
          ZER0_CERT_PASSWORD: ${{ secrets.ZER0_SIGNING_CERT_PASSWORD }}
        run: |
          CERTFILE="$(mktemp -d)/cert.p12"
          echo "$ZER0_CERT_BASE64" | base64 --decode > "$CERTFILE"
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import "$CERTFILE" -k build.keychain -P "$ZER0_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k runner build.keychain
          security list-keychain -d user -s build.keychain "$(security list-keychain -d user | tr -d '"')"
          rm -rf "$(dirname "$CERTFILE")"

      - name: sign
        env:
          ZER0_CHANNEL: stable
          ZER0_SIGN_IDENTITY: ${{ secrets.ZER0_SIGN_IDENTITY_STABLE }}
        run: ./scripts/sign.sh

      - name: notarize
        # Keychain profiles do not survive an ephemeral runner, so CI takes
        # the App Store Connect API key path. notarize.sh wants a file at
        # ZER0_APPLE_KEY_PATH; the .p8 arrives as a secret and is decoded
        # here, into a directory that dies with the step.
        env:
          ZER0_CHANNEL: stable
          ZER0_APPLE_ID: ${{ secrets.ZER0_APPLE_ID }}
          ZER0_APPLE_KEY_ID: ${{ secrets.ZER0_APPLE_KEY_ID }}
          ZER0_APPLE_TEAM_ID: ${{ secrets.ZER0_APPLE_TEAM_ID }}
          ZER0_NOTARY_KEY_P8_BASE64: ${{ secrets.ZER0_NOTARY_KEY_P8_BASE64 }}
        run: |
          KEYDIR="$(mktemp -d)"
          echo "$ZER0_NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEYDIR/AuthKey.p8"
          export ZER0_APPLE_KEY_PATH="$KEYDIR/AuthKey.p8"
          ./scripts/notarize.sh
          rm -rf "$KEYDIR"

      - name: archive
        run: |
          ditto -c -k --keepParent "apple/.build/Zer0.app" "${{ steps.ver.outputs.archive }}"

      - name: upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: zer0-stable-${{ steps.ver.outputs.version }}
          path: ${{ steps.ver.outputs.archive }}
          retention-days: 90

      - name: create release
        # The tag already exists; this attaches the archive to it as a
        # downloadable asset. The release is published (not draft) because
        # the appcast enclosure points at this exact URL and Sparkle cannot
        # fetch a draft asset -- the "release goes live" signal is the
        # appcast entry that follows, not the visibility of this page.
        #
        # `make_latest: true` is written out, not left to the action's
        # default: the rolling `latest` release on main is published with
        # --latest=false (ADR-0125), and the Latest badge must move only
        # with a tag. A default change on either side must not be able to
        # move the recommendation silently.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.archive }}
          generate_release_notes: true
          make_latest: true

      # LGPL 6(a) (docs/licensing.md section 6): a release that embeds WebKit
      # must offer the exact source of the pinned revision alongside the
      # binary. The tarball is deterministic per pin, so it is cached as a
      # file (the build-webkit.yml pattern) rather than re-cloned and
      # re-compressed on every release.
      - name: restore WebKit source offer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v4
        with:
          path: dist-source
          key: webkit-source-${{ steps.pin.outputs.pin }}

      - name: build WebKit source offer
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/source-offer.sh --out dist-source --release "$GITHUB_REF_NAME"

      - name: upload WebKit source offer
        # --clobber, and the same asset name on every release sharing the
        # WebKit pin: the tag's tarball also lands on canary's releases.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist-source/webkit-source-*.tar.zst dist-source/SHA256SUMS --clobber

      - name: publish appcast
        # Last on purpose and the only writer of the appcast. The release
        # above is already up, so the enclosure URL resolves before the
        # entry that advertises it lands. See scripts/publish-appcast.sh.
        if: steps.signing.outputs.sparkle == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZER0_SPARKLE_PRIVATE_KEY: ${{ secrets.ZER0_SPARKLE_PRIVATE_KEY }}
        run: |
          ./scripts/publish-appcast.sh \
            --channel stable \
            --version "${{ steps.ver.outputs.version }}" \
            --bundle-version "${{ steps.ver.outputs.bundle_version }}" \
            --archive "${{ steps.ver.outputs.archive }}" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.ver.outputs.archive }}" \
            --sparkle-private-key "$ZER0_SPARKLE_PRIVATE_KEY"

      - name: clean up signing keychain
        # Last and always: the temporary keychain holds a private key, and
        # the runner being ephemeral is no reason to leave it lying around
        # for the steps that did not need it. `|| true` because a job that
        # failed before the import never created one.
        if: always()
        run: security delete-keychain build.keychain || true

  # The Linux artefact of the same tag (ADR-0125): the core plus the GTK
  # shell, packed as a tar.gz with its runtime dependencies declared beside
  # the binary. It needs `build` because the release it attaches to is
  # created there; it deliberately does not gate it -- a broken GTK header
  # on ubuntu must not hold a signed, notarised macOS release hostage. The
  # failure stays loud as a red job on the tag's run, and a re-run attaches
  # with --clobber once fixed.
  linux-stable:
    name: linux stable artefact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ startsWith(github.ref, 'refs/tags/') }}

      # The same packages ci.yml's linux-shell job installs: the headers
      # the -sys crates ask pkg-config for. `libwebkitgtk-6.0-dev` is the
      # GTK4 API of WebKitGTK, which the `webkit6` crate binds.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - run: cargo build -p zer0-linux --release

      - name: pack tarball
        id: pack
        # The shell reads design/tokens.toml and design/logo/zer0.svg at
        # runtime, walking up from the working directory (ADR-0122), so the
        # tarball carries them beside the binary: unpacked and run from its
        # own directory, the app finds its design without an install step.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          dir="zer0-${ver}-linux-${arch}"
          mkdir -p "${dir}/design/logo"
          cp target/release/zer0 "${dir}/zer0"
          cp design/tokens.toml "${dir}/design/tokens.toml"
          cp design/logo/zer0.svg "${dir}/design/logo/zer0.svg"
          {
            echo "zer0 ${ver} for Linux (${arch})"
            echo
            echo "Run ./zer0 from this directory; it reads design/tokens.toml"
            echo "from the working directory, or ZER0_TOKENS if set."
            echo
            echo "Runtime dependencies are provided by the distribution:"
            echo "GTK 4.12 or newer and WebKitGTK's 6.0 (GTK4) API. On"
            echo "Ubuntu 24.04: sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4;"
            echo "elsewhere, whatever provides those two libraries."
          } > "${dir}/README"
          tar -czf "${dir}.tar.gz" "${dir}"
          echo "tarball=${dir}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: attach to the tag's release
        # The release exists by the time this runs -- `build` created it.
        # The same `gh release upload` door the WebKit source offer uses,
        # for the same reason: the asset list is append-only from wherever
        # an artefact becomes ready. Skipped on workflow_dispatch, where
        # GITHUB_REF_NAME is not a tag.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" --clobber
