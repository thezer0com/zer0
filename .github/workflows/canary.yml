name: canary

# A canary build fires on every push to `main` (ADR-0109). It is the
# population that absorbs breakage so stable does not have to, and its
# cadence is "every commit someone pushed", not "every Friday". The
# bundle id is `com.thezer0.canary` (resolve-bundle.sh), the profile
# directory is `Zer0 Canary/`, and the appcast is `appcast-canary.xml`.
#
# Every push also rewrites the rolling `latest` GitHub Release (the
# `rolling-latest` job): the human-facing door to the tip of `main`,
# secret-free by design -- only GITHUB_TOKEN. The appcast never points
# at it; that job's comment says why the two channels coexist.
#
# Signing is conditional on secrets being present. Today the project
# signs ad-hoc (ADR-0109, ADR-0108); when a Developer ID Application
# identity exists, `ZER0_SIGN_IDENTITY_CANARY` plus the .p12/password
# pair that imports it turn the sign.sh step on. The same gates guard
# notarisation (four App Store Connect credentials -- an ephemeral
# runner has no stored keychain profile) and the Sparkle appcast
# publish -- none of them can run without the secrets that precede
# them.
#
# The WebKit engine is not built here. It is restored from the cache
# written by build-webkit.yml, keyed on the canary sha in
# scripts/webkit/version.txt (ADR-0124: canary pins an exact commit of
# WebKit `main`). If that cache is missing the job fails fast: a canary
# release without its pinned engine is no release at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Canary is the hot branch. A new push supersedes the previous run:
  # nobody consumes an in-flight canary build, and serialising them
  # would make "every push to main" a polite fiction under load.
  #
  # The rolling `latest` release adds a correctness reason to cancel rather
  # than queue: its publish is delete-then-recreate, so a superseded run
  # left alive could recreate the release after a newer run already did and
  # move `latest` backwards. Cancelling keeps exactly one writer.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # contents: write for both writers this file holds: the appcast publisher
  # (commits to gh-pages) and the rolling-release job (rewrites the `latest`
  # tag and its release). No other scope is granted.
  contents: write

jobs:
  build:
    runs-on: blacksmith-6vcpu-macos-15
    # 90, not 30, because of the WebKit source offer below: on a pin bump it
    # clones ~7.4 GB and runs zstd -19 over ~5.3 GB of source on a 6-vcpu
    # runner. The tarball is cached per tag, so steady-state runs stay short.
    timeout-minutes: 90
    # The rolling-release job names the artifact it downloads by version;
    # exporting it here is the one door that name passes through.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      archive: ${{ steps.ver.outputs.archive }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: toolchain
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::$DEVELOPER_DIR is gone on the Blacksmith image." >&2
            ls -d /Applications/Xcode_*.app >&2 || true
            exit 1
          fi
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # The release build is the expensive half of this job after the
          # engine restore. Losing the Rust cache to a flaky Swift step
          # would tax every canary push with a cold 163-crate rebuild.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: read WebKit pin
        id: pin
        # Canary's pin is a sha of `main` (ADR-0124), read as data the same
        # way scripts/webkit/common.sh reads it -- never sourced.
        run: |
          pin="$(sed -n 's/^WEBKIT_CANARY_SHA=//p' scripts/webkit/version.txt | tail -1)"
          [[ -n "$pin" ]] || { echo "no WEBKIT_CANARY_SHA in version.txt" >&2; exit 1; }
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      - name: restore WebKit build
        id: webkit
        uses: actions/cache@v4
        with:
          path: webkit-build.tar.zst
          key: webkit-canary-${{ steps.pin.outputs.pin }}
          fail-on-cache-miss: true

      - name: extract WebKit
        # Restore puts the tarball at the repo root; embed-webkit.sh
        # reads from ~/.cache/zer0/webkit/src/WebKitBuild/Release, so
        # the unpack lands there. Keeping the path identical to a
        # local developer's means scripts do not branch on "are we in
        # CI".
        run: |
          mkdir -p ~/.cache/zer0/webkit/src/WebKitBuild
          tar -x -I zstd -f webkit-build.tar.zst \
            -C ~/.cache/zer0/webkit/src/WebKitBuild

      - name: compute version
        id: ver
        # Runs before the build because the bundle carries the answer:
        # bundle.sh stamps these into CFBundleShortVersionString and
        # CFBundleVersion (ADR-0111). Canary versions are unambiguous and
        # monotonically sortable, and carry the commit they came from so a bug
        # report names the exact binary. `0.0.0-canary.<timestamp>-<sha>` is
        # not SemVer-pretty but it is honest, and Sparkle ranks on
        # sparkle:version not shortVersionString. The bundle's CFBundleVersion
        # and the appcast's sparkle:version both come from the one door --
        # bundle_version_for_channel in apple/scripts/resolve-bundle.sh --
        # and publish-appcast.sh refuses a disagreement, so they cannot drift.
        run: |
          ts="$(date -u +%Y%m%d%H%M)"
          sha="$(git rev-parse --short HEAD)"
          v="0.0.0-canary.${ts}-${sha}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "archive=zer0-canary-${v}.zip" >> "$GITHUB_OUTPUT"
          . apple/scripts/resolve-bundle.sh
          echo "bundle_version=$(bundle_version_for_channel canary "$v")" >> "$GITHUB_OUTPUT"

      - name: build canary
        env:
          ZER0_CHANNEL: canary
          ZER0_BUNDLE_VERSION: ${{ steps.ver.outputs.bundle_version }}
          ZER0_SHORT_VERSION: ${{ steps.ver.outputs.version }}
          ZER0_EMBED_WEBKIT: ~/.cache/zer0/webkit/src/WebKitBuild/Release
          ZER0_SPARKLE_PUBLIC_KEY: ${{ secrets.ZER0_SPARKLE_PUBLIC_KEY }}
        run: ./scripts/build.sh release

      # Secrets cannot be read directly in a job-level `if`. A step that
      # exports their presence is the standard pattern; it keeps the
      # value off the log and gives the downstream steps one boolean.
      - name: detect signing secrets
        id: signing
        # Three booleans, one per gate. Signing needs the identity name
        # AND the .p12 + password that import it (an ephemeral runner has
        # no keychain); notarisation needs all four App Store Connect
        # credentials. A partial set is a skip, not a half-run, and the
        # value never lands in the log -- only the boolean does.
        run: |
          si="${{ secrets.ZER0_SIGN_IDENTITY_CANARY }}"
          cert="${{ secrets.ZER0_SIGNING_CERT_P12_BASE64 }}"
          certpw="${{ secrets.ZER0_SIGNING_CERT_PASSWORD }}"
          aid="${{ secrets.ZER0_APPLE_ID }}"
          kid="${{ secrets.ZER0_APPLE_KEY_ID }}"
          kp8="${{ secrets.ZER0_NOTARY_KEY_P8_BASE64 }}"
          tid="${{ secrets.ZER0_APPLE_TEAM_ID }}"
          sp="${{ secrets.ZER0_SPARKLE_PRIVATE_KEY }}"
          [[ -n "$si" && -n "$cert" && -n "$certpw" ]] && echo "sign=true"      >> "$GITHUB_OUTPUT" || echo "sign=false"      >> "$GITHUB_OUTPUT"
          [[ -n "$aid" && -n "$kid" && -n "$kp8" && -n "$tid" ]] && echo "notarize=true"  >> "$GITHUB_OUTPUT" || echo "notarize=false"  >> "$GITHUB_OUTPUT"
          [[ -n "$sp" ]] && echo "sparkle=true"   >> "$GITHUB_OUTPUT" || echo "sparkle=false"   >> "$GITHUB_OUTPUT"

      - name: import signing certificate
        # Runner keychains are empty; the identity arrives as a .p12 in a
        # secret. Temporary keychain, cleaned in post — never touches the
        # login keychain.
        if: steps.signing.outputs.sign == 'true'
        env:
          ZER0_CERT_BASE64: ${{ secrets.ZER0_SIGNING_CERT_P12_BASE64 }}
          ZER0_CERT_PASSWORD: ${{ secrets.ZER0_SIGNING_CERT_PASSWORD }}
        run: |
          CERTFILE="$(mktemp -d)/cert.p12"
          echo "$ZER0_CERT_BASE64" | base64 --decode > "$CERTFILE"
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import "$CERTFILE" -k build.keychain -P "$ZER0_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k runner build.keychain
          security list-keychain -d user -s build.keychain "$(security list-keychain -d user | tr -d '"')"
          rm -rf "$(dirname "$CERTFILE")"

      - name: sign
        if: steps.signing.outputs.sign == 'true'
        env:
          ZER0_CHANNEL: canary
          ZER0_SIGN_IDENTITY: ${{ secrets.ZER0_SIGN_IDENTITY_CANARY }}
        run: ./scripts/sign.sh

      - name: notarize
        # Keychain profiles do not survive an ephemeral runner, so CI takes
        # the App Store Connect API key path. notarize.sh wants a file at
        # ZER0_APPLE_KEY_PATH; the .p8 arrives as a secret and is decoded
        # here, into a directory that dies with the step.
        if: steps.signing.outputs.notarize == 'true'
        env:
          ZER0_CHANNEL: canary
          ZER0_APPLE_ID: ${{ secrets.ZER0_APPLE_ID }}
          ZER0_APPLE_KEY_ID: ${{ secrets.ZER0_APPLE_KEY_ID }}
          ZER0_APPLE_TEAM_ID: ${{ secrets.ZER0_APPLE_TEAM_ID }}
          ZER0_NOTARY_KEY_P8_BASE64: ${{ secrets.ZER0_NOTARY_KEY_P8_BASE64 }}
        run: |
          KEYDIR="$(mktemp -d)"
          echo "$ZER0_NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEYDIR/AuthKey.p8"
          export ZER0_APPLE_KEY_PATH="$KEYDIR/AuthKey.p8"
          ./scripts/notarize.sh
          rm -rf "$KEYDIR"

      - name: archive
        run: |
          ditto -c -k --keepParent "apple/.build/Zer0 Canary.app" "${{ steps.ver.outputs.archive }}"

      - name: upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: zer0-canary-${{ steps.ver.outputs.version }}
          path: ${{ steps.ver.outputs.archive }}
          retention-days: 30

      # The appcast publisher is the last step on purpose. It mutates a
      # branch (`gh-pages`) that lives outside the one that triggered
      # the workflow, and keeping it last means every failure upstream
      # shows up as "no appcast update" rather than as a stale entry
      # pointing at a binary that does not exist.
      #
      # The publish is two steps: attach the archive to a GitHub Release the
      # appcast enclosure points at, then prepend the signed entry. The
      # release goes up first so the URL Sparkle advertises is reachable
      # before the entry that advertises it is; reversing that order ships
      # an appcast whose download 404s until the release catches up.
      - name: upload bundle to release
        if: steps.signing.outputs.sparkle == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "canary-${{ steps.ver.outputs.version }}" \
            --prerelease \
            --title "zer0 Canary ${{ steps.ver.outputs.version }}" \
            --notes "Automated canary build from ${{ github.sha }}." \
            "${{ steps.ver.outputs.archive }}"

      # LGPL 6(a) (docs/licensing.md section 6): the canary bundle embeds its
      # own pinned WebKit -- the sha of `main`, not stable's tag (ADR-0124) --
      # so the source offer is the sha's source, cached per sha like
      # build-webkit.yml's artefact so only a bump pays the compression.
      # Gated like the bundle upload above: without the release there is
      # nothing to attach the asset to.
      - name: restore WebKit source offer
        if: steps.signing.outputs.sparkle == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: dist-source
          key: webkit-source-${{ steps.pin.outputs.pin }}

      - name: build WebKit source offer
        if: steps.signing.outputs.sparkle == 'true' && github.ref == 'refs/heads/main'
        # ZER0_CHANNEL tells source-offer.sh which pin to archive; without it
        # the script defaults to stable and offers the wrong engine's source.
        env:
          ZER0_CHANNEL: canary
        run: |
          ./scripts/source-offer.sh --out dist-source \
            --release "canary-${{ steps.ver.outputs.version }}"

      - name: upload WebKit source offer
        if: steps.signing.outputs.sparkle == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "canary-${{ steps.ver.outputs.version }}" \
            dist-source/webkit-source-*.tar.zst dist-source/SHA256SUMS --clobber

      - name: publish appcast
        if: steps.signing.outputs.sparkle == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZER0_SPARKLE_PRIVATE_KEY: ${{ secrets.ZER0_SPARKLE_PRIVATE_KEY }}
        run: |
          ./scripts/publish-appcast.sh \
            --channel canary \
            --version "${{ steps.ver.outputs.version }}" \
            --bundle-version "${{ steps.ver.outputs.bundle_version }}" \
            --archive "${{ steps.ver.outputs.archive }}" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/canary-${{ steps.ver.outputs.version }}/${{ steps.ver.outputs.archive }}" \
            --sparkle-private-key "$ZER0_SPARKLE_PRIVATE_KEY"

      - name: clean up signing keychain
        # Last and always: the temporary keychain holds a private key, and
        # the runner being ephemeral is no reason to leave it lying around
        # for the steps that did not need it. `|| true` because a job that
        # skipped the import (ad-hoc canary) never created one.
        if: always()
        run: security delete-keychain build.keychain || true

  # The Linux half of the rolling release. Same image and same apt line as
  # ci.yml's `linux-shell`, so the dependency story cannot drift between the
  # gate that compiles the shell and the build that ships it. This job only
  # produces an artifact and never calls `gh`: the release is created by one
  # job (rolling-latest below), so there is a single writer and no
  # upload-against-a-recreate race. Not gated on main -- a dispatched branch
  # build still proves the Linux host compiles; only the release door cares
  # about the ref.
  linux-rolling:
    runs-on: ubuntu-latest
    # Matched to ci.yml's linux-shell: a cold GTK-stack build is measured
    # minutes on the free runner, and half an hour is generous against a
    # hung runner -- which is worse than a red build for the same reason
    # that job says.
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      archive: ${{ steps.build.outputs.archive }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The -dev headers the `-sys` crates bind against; the same single
      # command as ci.yml (the update matters: a bare install reads a
      # package list a runner-image rebuild may have pruned).
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: build linux host
        id: build
        run: |
          cargo build -p zer0-linux --release
          sha="$(git rev-parse --short HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "archive=zer0-linux-${sha}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: pack tarball
        # The README travels inside the tarball on purpose: the binary alone
        # does not tell anyone which system libraries a run requires.
        run: |
          sha="${{ steps.build.outputs.sha }}"
          stage="$(mktemp -d)"
          cp target/release/zer0 "$stage/zer0"
          cat >"$stage/README" <<EOF
          zer0 -- Linux host, rolling build of main @ ${sha}

          Automated rolling build, replaced on every push to main. This is
          not a stable release.

          Runtime requirements (what linux/shell/Cargo.toml links against:
          gtk4 with the v4_12 feature, webkit6):
            GTK 4 >= 4.12
            WebKitGTK 6.0 -- the GTK4 API of WebKitGTK

          Debian/Ubuntu 24.04 or newer:
            sudo apt-get install libgtk-4-1 libwebkitgtk-6.0-4

          Unpack anywhere and run ./zer0
          EOF
          tar -czf "zer0-linux-${sha}.tar.gz" -C "$stage" zer0 README
      - uses: actions/upload-artifact@v4
        with:
          name: zer0-linux-${{ steps.build.outputs.sha }}
          path: zer0-linux-${{ steps.build.outputs.sha }}.tar.gz
          # rolling-latest downloads it moments later; this copy is
          # plumbing, not a product, so it does not linger 30 days like
          # the macOS artifact a human might still want from the run page.
          retention-days: 1

  # The rolling `latest` release: the human-facing door to the tip of main.
  # "Try the current build" should need no secrets, no Sparkle and no
  # 30-day artifact hunt -- just a GitHub URL that always serves the newest
  # green push.
  #
  # Why it coexists with the per-version `canary-<version>` releases above:
  # the Sparkle appcast points its enclosure URLs at immutable per-version
  # releases, and a Sparkle client must never be served a different binary
  # under a URL it cached. `latest` is delete-and-recreate and therefore can
  # never enter the appcast; it is for humans, not for Sparkle.
  #
  # Single writer: this is the only job that creates or deletes the `latest`
  # release, and it downloads every artifact first and publishes once. A
  # partial release (macOS asset live, Linux missing) cannot happen, and no
  # upload can race a recreate.
  #
  # `needs` holds the release back when either host is red on purpose: a
  # release claiming to be "main" should not move while main is broken. The
  # previous green push's `latest` simply stays until a fully green push
  # replaces it -- fail closed, same instinct as the WebKit cache miss.
  rolling-latest:
    needs: [build, linux-rolling]
    # workflow_dispatch can run on any branch; `latest` must track main
    # only -- the same gate the appcast steps carry.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A full clone plus two gh calls; generous against a slow clone, and a
    # hung publisher must not sit on the concurrency slot forever.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the notes walk commits back to the newest v* tag,
          # which a depth-1 checkout cannot even see.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: zer0-canary-${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: zer0-linux-${{ needs.linux-rolling.outputs.sha }}
      - name: compose release notes
        run: |
          sha="$(git rev-parse --short HEAD)"
          since="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          {
            echo "### Rolling build of \`main\` @ \`${sha}\`"
            echo
            echo "Automated build of the tip of \`main\`, commit [\`${sha}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})."
            echo "This release is rewritten on every push: nothing here is stable, and the"
            echo "\`Latest\` badge belongs to the official \`v*\` releases, not this one."
            echo
            if [[ -n "$since" ]]; then
              echo "**Commits since ${since}:**"
            else
              # No v* tag exists yet; the honest fallback is "the last few
              # commits", not an invented range.
              echo "**Recent commits (no \`v*\` tag exists yet):**"
            fi
            echo '```'
            if [[ -n "$since" ]]; then
              git log "${since}..HEAD" --oneline
            else
              git log -10 --oneline
            fi
            echo '```'
            echo
            echo "**Assets**"
            echo
            echo "- \`${{ needs.build.outputs.archive }}\` -- macOS app, WebKit embedded (canary profile)"
            echo "- \`${{ needs.linux-rolling.outputs.archive }}\` -- Linux host binary and README (runtime deps inside)"
            echo
            echo "**Signature:** signed and notarized when secrets are configured; otherwise"
            echo "ad-hoc -- Gatekeeper may refuse to launch it on other Macs (right-click, Open)."
          } > notes.md
      - name: publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          # Delete-and-recreate rather than edit-in-place: the tag must move
          # to the new commit and stale assets must not survive, and a fresh
          # create is the only mode that guarantees both. `|| true` covers
          # the first run and the run after a cancelled predecessor: there
          # is nothing to delete.
          gh release delete latest --yes --cleanup-tag || true
          # --latest=false is load-bearing: the repo's "Latest" badge stays
          # on official v* releases, and a rolling channel must never wear
          # it. --prerelease implies this today; saying it makes it a
          # guarantee instead of a side effect.
          gh release create latest \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "zer0 rolling (main @ ${sha})" \
            --notes-file notes.md \
            "${{ needs.build.outputs.archive }}" "${{ needs.linux-rolling.outputs.archive }}"
