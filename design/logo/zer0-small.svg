<!--
  zer0 — the mark, hinted for small sizes.

  Same idea as zer0.svg: a purple zero cut on the diagonal, its two halves
  slipped along the cut. This one is redrawn for the sizes where the
  canonical file stops working — and where its white "zer" inlay was never
  going to work at all.

  What changed from the canonical drawing, and why each change earns its
  place:

  - The inlay is dropped, not hinted. It is 28 units wide on a 170-unit mark:
    at 32px that is five pixels for three glyphs, and at 16px it is two and a
    half. There is no redraw of "zer" that lands each glyph on a pixel the eye
    can find, so the honest drawing at these sizes is the zero alone — which
    still says the name, the way the previous mark did.
  - Ring thicker, 34u -> 46.75u (x1.375, the same multiple the previous
    hinted master used). At 16px this is the difference between a ring
    antialiasing turns to grey mush and one that stays purple.
  - Gap wider, 16u -> 23u, and slip longer, 8u -> 11u (both ~x1.4): the cut
    stays a feature the eye finds rather than a hairline crack.
  - Shorter overall, outer radii 85x99.5 -> 72.25x84.55 (~x0.85). The adopted
    canonical mark fills its viewBox edge to edge, which leaves no room for
    the halves to be pried apart; the hinted drawing has to give some height
    back to fit its own translations inside the same frame.

  Geometry: an elliptical ring, 72.25x84.55 outer and 25.5x37.8 inner radii
  (counter 51x75.6 — kept large, because a zero that loses its counter is a
  dot), centred on 85,99.5, cut at 45 degrees. Each half is then translated
  23u/2 perpendicular to the cut and 11u/2 along it, in opposite directions.

  Where to use it: 16px and 32px, which is 16pt at 1x and 2x and 32pt at 1x.
  From 64px up the canonical mark is legible and is the one to draw.
  apple/scripts/make-icon.sh does that routing.

  Technical contract: same as zer0.svg — no <text>, no stroke, transform,
  mask or clipPath, no width/height — except this master is one path in the
  artwork's purple #635BC9, matching the canonical ring it stands in for.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 199">
  <path fill="#635BC9" fill-rule="evenodd"
        d="M151.95 48.82A72.25 84.55 0 0 1 42.09 158.67L75.88 124.88A25.5 37.8 0 0 0 118.16 82.60ZM18.05 150.18A72.25 84.55 0 0 1 127.91 40.33L94.12 74.12A25.5 37.8 0 0 0 51.84 116.40Z"/>
</svg>
