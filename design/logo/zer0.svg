<!--
  zer0 — the mark, adopted.

  A purple zero cut on the diagonal, its two halves slipped along the cut,
  with a white "zer" inlaid on the band at the upper right, reading along
  the cut: zer + the zero itself. One lockup, not a mark beside a wordmark —
  the letters are placed against the band, not next to it.

  Adopted from the supplied zer0-logo.svg intake asset (2026-09), then made
  canonical here and the duplicate removed. Normalisation only dropped the
  width/height attributes: the geometry is verbatim, control points and all.
  The supplied curves' control hull grazes about 2u past the frame the file
  itself declares; the ink runs edge to edge of the viewBox.

  Geometry, measured: the outer ellipse is the full canvas — radii 85 x 99.5
  on a 170x199 viewBox, centred on 85,99.5 — the inner one ~51 x 66.4, so the
  ring is ~34u thick. Cut at 45 degrees, gap ~16u, slip ~8u. The inlay spans
  (133,40)-(161,70), on the band, and is 28u wide — remember that number for
  the size limit below.

  What this file guarantees, and why each rule earns its place:

  - No <text>: the "zer" is explicit geometry — five subpaths once the e's
    counter is counted — so no installed font is involved in drawing it.
  - No stroke, transform, mask or clipPath: anything not in the path geometry
    disappears when this is converted to .icns, a favicon or a font.
  - No width/height on <svg>: the size belongs to whoever draws it.
  - Two literal fills, #635BC9 and #FFFFFF: the artwork owns its colour. The
    old contract's fill="currentColor" assumed a one-ink mark; this one is
    two, so inheriting ink is no longer a thing it can promise. Consumers
    that need one ink (the quiet empty states) draw the purple path alone —
    an inlay in a single-colour band is invisible by construction.

  Known limit: at 32 rendered pixels and below the cut degrades into a notch
  AND the inlay — 28u of a 170u mark — is five pixels of mush. Use
  zer0-small.svg there: it drops the inlay and redraws the cut, which is a
  redraw and not a scale. See ADR-0040.
-->
